name: Verificar
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web_backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r web_backend/requirements.txt
      - run: python -m unittest discover -s web_backend/tests -v
      - run: node --test web/tests/model.test.mjs web/tests/symbology.test.mjs web/tests/networks.test.mjs
